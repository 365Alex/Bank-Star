# Application name
spring.application.name=star

# PRIMARY DATASOURCE
spring.datasource.url=jdbc:h2:mem:appdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true

# SECONDARY DATASOURCE
application.recommendations-db.url=jdbc:h2:file:./transaction
application.recommendations-db.driver-class-name=org.h2.Driver
application.recommendations-db.username=sa
application.recommendations-db.password=
application.recommendations-db.read-only=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Application
spring.application.name=star-bank-recommendations
app.version=1.0.0

# Server
server.port=8080

# Primary Database (H2 ??? ????????, ?????? PostgreSQL)
spring.datasource.url=jdbc:h2:mem:primarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Recommendations Database (H2 file-based - READ ONLY)
recommendations.datasource.url=jdbc:h2:file:./data/transaction;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
recommendations.datasource.driver-class-name=org.h2.Driver
recommendations.datasource.username=sa
recommendations.datasource.password=
recommendations.datasource.read-only=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Telegram Bot
telegram.bot.enabled=true
telegram.bot.token=8253067700:AAE-jj3vJOvuCwYMDTXQo6fFEZby4ogsEhs
telegram.bot.name=star_bank_bot

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# Logging
logging.level.com.bank.star=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
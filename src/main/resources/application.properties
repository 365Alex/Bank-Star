# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
server.servlet.context-path=/
spring.application.name=star-bank-recommendations
app.version=1.0.0

# ============================================
# PRIMARY DATABASE (JPA)
# ============================================
spring.datasource.primary.jdbc-url=jdbc:h2:file:./data/primary;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.primary.username=sa
spring.datasource.primary.password=
spring.datasource.primary.driver-class-name=org.h2.Driver

# ============================================
# RECOMMENDATIONS DATABASE (Analytics)
# ============================================
spring.datasource.recommendations.jdbc-url=jdbc:h2:file:./data/recommendations;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.recommendations.username=sa
spring.datasource.recommendations.password=
spring.datasource.recommendations.driver-class-name=org.h2.Driver

# ============================================
# JPA CONFIGURATION
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# H2 CONSOLE (??? ???????)
# ============================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=true
spring.h2.console.settings.web-allow-others=true

# ============================================
# LOGGING
# ============================================
logging.level.com.bank.star=DEBUG
logging.level.org.springframework.jdbc.core=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.transaction=DEBUG